[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seoul-synthetic-journey-generator"
version = "0.1.0"
description = "Independent synthetic labelled GPS dataset generator for Seoul mobility evaluation"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "networkx>=3.2",
    "openpyxl>=3.1",
    "osmium>=4.0",
    "pandas>=2.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
